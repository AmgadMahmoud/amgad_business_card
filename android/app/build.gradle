plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Signing keys live outside version control: android/key.properties (release)
// and android/debug-key.properties (debug). storeFile is relative to android/.
def loadKeyProperties(String name) {
    def properties = new Properties()
    def file = rootProject.file(name)
    if (file.exists()) {
        file.withReader('UTF-8') { reader -> properties.load(reader) }
    }
    return properties
}

def releaseKeyProperties = loadKeyProperties('key.properties')
def debugKeyProperties = loadKeyProperties('debug-key.properties')

android {
    namespace "com.amgad.amgad_business_card"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.amgad.amgad_business_card"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk flutter.minSdkVersion
        targetSdk 37
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        debug {
            if (debugKeyProperties['storeFile']) {
                storeFile rootProject.file(debugKeyProperties['storeFile'])
                storePassword debugKeyProperties['storePassword']
                keyAlias debugKeyProperties['keyAlias']
                keyPassword debugKeyProperties['keyPassword']
            }
        }
        release {
            if (releaseKeyProperties['storeFile']) {
                storeFile rootProject.file(releaseKeyProperties['storeFile'])
                storePassword releaseKeyProperties['storePassword']
                keyAlias releaseKeyProperties['keyAlias']
                keyPassword releaseKeyProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without key.properties (e.g. a fresh clone) fall back to debug
            // signing so `flutter run --release` still works.
            signingConfig releaseKeyProperties['storeFile']
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
