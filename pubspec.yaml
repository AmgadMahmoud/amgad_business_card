name: amgad_business_card
description: "Amgad's online business card"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+6

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  go_router: ^17.3.0
  flutter_gen: ^5.14.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4

# to use flutter gen => dart run build_runner build
# to delete conflicts => dart run build_runner build --delete-conflicting-outputs

flutter_gen:
  output: lib/src/gen/
  integrations:
    flutter_svg: true

# to use flutter native splash => dart run flutter_native_splash:create

flutter_native_splash:
  color: "#FBF4EC"
  image: assets/splash/splash.png
  color_dark: "#1A1411"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#FBF4EC"
    image: assets/splash/splash_android12.png
    color_dark: "#1A1411"
    image_dark: assets/splash/splash_android12.png
  fullscreen: false

# to generate app icons => dart run flutter_launcher_icons

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: "ic_launcher"
  adaptive_icon_background: "#DFAB76"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FBF4EC"
    theme_color: "#9A4F2A"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
